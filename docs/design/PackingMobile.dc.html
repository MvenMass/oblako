body{margin:0}
@keyframes aur{0%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-18px) scale(1.12)}100%{transform:translate(0,0) scale(1)}}
@keyframes shift{to{background-position:300% 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.aur{position:absolute;border-radius:50%;filter:blur(60px);animation:aur 16s ease-in-out infinite;pointer-events:none}
.grad{background:linear-gradient(90deg,#0A79A8,#E8288E 33%,#8B6CF0 66%,#0A79A8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 8s linear infinite}

.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scr::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hs>*{scroll-snap-align:start;flex:none}
button:focus-visible,a:focus-visible{outline:3px solid #C8146F;outline-offset:3px}
@keyframes dropIn{0%{opacity:0;transform:translateY(160px) scale(1.4) rotate(-20deg)}70%{opacity:1;transform:translateY(-6px) scale(.95)}100%{transform:none}}.drop{animation:dropIn .55s cubic-bezier(.3,1.1,.4,1) both}
@keyframes shelf{from{opacity:0;transform:translateY(-30px) scale(.8)}to{opacity:1;transform:none}}.shelfIt{animation:shelf .45s cubic-bezier(.3,1.3,.4,1) both}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.tag{animation:sway 4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.aur,.grad,.rise,.drop,.shelfIt,.tag{animation:none !important}}
</style>
