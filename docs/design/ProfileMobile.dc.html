@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.bar{transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both .3s}
@keyframes thump{0%{opacity:0;transform:rotate(calc(var(--r) - 18deg)) scale(2.2)}55%{opacity:1;transform:rotate(var(--r)) scale(.8)}75%{transform:rotate(var(--r)) scale(.9)}100%{opacity:1;transform:rotate(var(--r)) scale(.86)}}
.stamp{opacity:0;animation:thump .5s cubic-bezier(.3,.7,.3,1) both}
@media (prefers-reduced-motion: reduce){.stamp{opacity:1}}
@media (prefers-reduced-motion: reduce){.aur,.grad,.rise,.bar,.stamp{animation:none !important}}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const A = [["#9BE3F8", "#0A79A8"], ["#FFC2E0", "#C8146F"], ["#B5F0D4", "#2F6B4F"], ["#FFE08A", "#E07A2E"]];
class Component extends DCLogic {
  state = { t: null };
  renderVals() {
    const st = this.state, out = { stats: [{ v: 7, l: 'поездок' }, { v: 5, l: 'стран' }, { v: '18\u00a0400', l: 'км в небе' }] };
    A.forEach((c, i) => {
      const t = st.t && st.t.i === i ? st.t : null;
      out['a' + i] = {
        move: (e) => { const r = e.currentTarget.getBoundingClientRect(); this.setState({ t: { i, x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height } }); },
        leave: () => this.setState({ t: null }),
        s: 'position: relative; width: 150px; height: 190px; padding: 16px; border: 0; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 4px; font-family: inherit; color: #FFFFFF; cursor: pointer; background: linear-gradient(150deg, ' + c[0] + ', ' + c[1] + '); box-shadow: 0 16px 30px rgba(11,37,64,.2); transition: transform .2s ease-out; transform: perspective(600px) rotateY(' + (t ? (t.x - .5) * 24 : 0) + 'deg) rotateX(' + (t ? (.5 - t.y) * 20 : 0) + 'deg)',
        holo: 'position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; transition: opacity .4s; opacity: ' + (t ? 1 : .45) + '; background: linear-gradient(115deg, rgba(255,255,255,0) 20%, #FF8CC6 34%, #7FD3F2 46%, #FFE08A 58%, #B9A8FF 70%, rgba(255,255,255,0) 84%); background-size: 260% 260%; background-position: ' + (t ? Math.round(t.x * 100) : 30) + '% ' + (t ? Math.round(t.y * 100) : 30) + '%'
      };
    });
    return out;
  }
}
</script>
