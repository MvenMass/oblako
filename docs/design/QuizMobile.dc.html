<style>
body{margin:0}
@keyframes aur{0%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-18px) scale(1.12)}100%{transform:translate(0,0) scale(1)}}
@keyframes shift{to{background-position:300% 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.aur{position:absolute;border-radius:50%;filter:blur(60px);animation:aur 16s ease-in-out infinite;pointer-events:none}
.grad{background:linear-gradient(90deg,#0A79A8,#E8288E 33%,#8B6CF0 66%,#0A79A8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 8s linear infinite}
.lg{position:relative;background:rgba(255,255,255,.45);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 18px 44px rgba(11,37,64,.1)}
.lgd{position:relative;background:rgba(255,255,255,.07);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.14)}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scr::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hs>*{scroll-snap-align:start;flex:none}
button:focus-visible,a:focus-visible{outline:3px solid #C8146F;outline-offset:3px}

@media (prefers-reduced-motion: reduce){.aur,.grad,.rise{animation:none !important}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const MOODS = [["sea", "#7FE0E6", "#FFD27F"], ["mountains", "#9FE3C1", "#9BCBF2"], ["food", "#F6A6C1", "#E9B9D6"], ["history", "#F3D49B", "#C3B5FF"], ["city", "#9BB4FF", "#F7A9D9"], ["exotic", "#FFB37F", "#7FE0B0"]];
class Component extends DCLogic {
  state = { moods: ['sea'] };
  renderVals() {
    const st = this.state, sel = st.moods.map((id) => MOODS.find((m) => m[0] === id));
    const out = {
      aurA: 'top: -120px; right: -140px; width: 400px; height: 400px; transition: background 1.2s; background: ' + (sel[0] ? sel[0][1] : '#9BDDF2'),
      aurB: 'top: 480px; left: -160px; width: 380px; height: 380px; opacity: .8; animation-delay: -6s; transition: background 1.2s; background: ' + (sel[1] ? sel[1][2] : sel[0] ? sel[0][2] : '#FFB3D6'),
      none: st.moods.length ? 'false' : 'true',
      nextLabel: st.moods.length ? 'Дальше · выбрано ' + st.moods.length + ' из 2' : 'Выберите настроение',
      nextS: 'width: 100%; min-height: 56px; border: 0; border-radius: 14px; font-family: inherit; font-size: 16px; font-weight: 600; color: #FFFFFF; transition: background .3s, box-shadow .3s; ' + (st.moods.length ? 'background: #C8146F; box-shadow: 0 14px 30px rgba(200,20,111,.35)' : 'background: #9FB3C2')
    };
    MOODS.forEach((m, i) => {
      const on = st.moods.indexOf(m[0]) > -1;
      out['m' + i] = { on: on ? 'true' : 'false',
        toggle: () => { const a = st.moods.slice(), k = a.indexOf(m[0]); if (k > -1) a.splice(k, 1); else if (a.length < 2) a.push(m[0]); this.setState({ moods: a }); },
        s: 'position: relative; height: 132px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; border-radius: 20px; font-family: inherit; color: #0B2540; cursor: pointer; transition: transform .35s cubic-bezier(.3,1.3,.4,1), background .4s, box-shadow .4s; ' + (on ? 'border: 2px solid #C8146F; background: linear-gradient(160deg, #FFFFFF, ' + m[1] + '); transform: translateY(-4px) rotate(-1.5deg); box-shadow: 0 18px 34px rgba(200,20,111,.22)' : 'border: 1px solid rgba(255,255,255,.8); background: rgba(255,255,255,.55); box-shadow: 0 10px 24px rgba(11,37,64,.08)'),
        check: 'position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #C8146F; transition: transform .35s cubic-bezier(.3,1.5,.4,1); transform: scale(' + (on ? 1 : 0) + ')' };
    });
    return out;
  }
}
</script>
