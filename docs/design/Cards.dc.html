<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ОБЛАКО — направления</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4FAFE}
@keyframes aur{0%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.15)}66%{transform:translate(-50px,30px) scale(.92)}100%{transform:translate(0,0) scale(1)}}
@keyframes shift{to{background-position:300% 0}}
.aur{position:absolute;border-radius:50%;filter:blur(80px);animation:aur 22s ease-in-out infinite}
.grad{background:linear-gradient(90deg,#0A79A8,#E8288E 33%,#8B6CF0 66%,#0A79A8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 8s linear infinite}
.lg{position:relative;background:rgba(255,255,255,.3);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -10px 30px rgba(255,255,255,.2),0 24px 60px rgba(11,37,64,.12)}
.folder,.sheet,.front{transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s}
@media (prefers-reduced-motion: reduce){.aur,.grad{animation:none}.folder,.sheet,.front{transition:none}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; min-height: 1000px; background: #F4FAFE; font-family: 'Onest', system-ui, sans-serif; color: #0B2540">

<div aria-hidden="true" class="aur" style="top: 200px; left: 50%; width: 900px; height: 560px; margin-left: -450px; background: #BDEBFA"></div>
<div aria-hidden="true" class="aur" style="top: 460px; left: 50%; width: 420px; height: 420px; margin-left: -380px; background: #FF8CC6; opacity: .6; animation-delay: -8s"></div>
<div aria-hidden="true" class="aur" style="top: 420px; left: 50%; width: 420px; height: 420px; margin-left: 60px; background: #B9A8FF; opacity: .6; animation-delay: -14s"></div>

<section style="position: relative; max-width: 1280px; margin: 0 auto; padding: 88px 24px 72px; display: flex; flex-direction: column; gap: 40px">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 640px">
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #0A79A8">Направления</p>
<h2 style="margin: 0; font-size: 60px; font-weight: 700; line-height: 1; letter-spacing: -0.04em">Куда <span class="grad">отправимся?</span></h2>
</div>
<div style="display: flex; gap: 10px">
<button type="button" aria-label="Предыдущее направление" onClick="{{prev}}" class="lg" style="width: 56px; height: 56px; border-radius: 16px; color: #0B2540; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" aria-label="Следующее направление" onClick="{{next}}" style="width: 56px; height: 56px; border-radius: 16px; border: 0; background: #0B2540; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>

<div role="group" aria-label="Фильтр направлений" style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: #0B2540; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500">Все</button>
<button type="button" aria-pressed="false" class="lg" style="min-height: 40px; padding: 0 16px; border-radius: 12px; color: #0B2540; font-family: inherit; font-size: 14px; font-weight: 500">Море</button>
<button type="button" aria-pressed="false" class="lg" style="min-height: 40px; padding: 0 16px; border-radius: 12px; color: #0B2540; font-family: inherit; font-size: 14px; font-weight: 500">Горы</button>
<button type="button" aria-pressed="false" class="lg" style="min-height: 40px; padding: 0 16px; border-radius: 12px; color: #0B2540; font-family: inherit; font-size: 14px; font-weight: 500">Города</button>
<button type="button" aria-pressed="false" class="lg" style="min-height: 40px; padding: 0 16px; border-radius: 12px; color: #0B2540; font-family: inherit; font-size: 14px; font-weight: 500">На&nbsp;выходные</button>
</div>

<div style="position: relative; height: 520px; perspective: 1400px">
<sc-for list="{{folders}}" as="f" hint-placeholder-count="7">
<button type="button" class="folder" onClick="{{f.pick}}" aria-expanded="{{f.expanded}}" aria-label="{{f.label}}" style="{{f.wrap}}">
<span aria-hidden="true" style="{{f.tab}}">{{f.code}}</span>
<span aria-hidden="true" style="{{f.back}}"></span>
<span class="sheet" style="{{f.sheet}}">
<span style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #0A79A8"><span>Досье</span><span>{{f.code}}</span></span>
<span style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #45607A">Перелёт</span><span style="font-size: 14px; font-weight: 600">[в пути]</span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #45607A">Сейчас</span><span style="font-size: 14px; font-weight: 600">[+°C]</span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #45607A">Валюта</span><span style="font-size: 14px; font-weight: 600">[курс]</span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #45607A">Бюджет</span><span style="font-size: 14px; font-weight: 600">[от … ₽]</span></span>
</span>
<span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 4px; height: 34px">
<sc-for list="{{f.temps}}" as="t"><span style="{{t.s}}"></span></sc-for>
</span>
</span>
<span class="front lg" style="{{f.front}}">
<span style="display: flex; justify-content: space-between; align-items: flex-start"><span aria-hidden="true" style="{{f.icon}}"></span><sc-if value="{{f.badge}}" hint-placeholder-val="{{ false }}"><span style="padding: 6px 10px; border-radius: 8px; background: #C8146F; color: #FFFFFF; font-size: 11px; font-weight: 800; letter-spacing: 0.12em">ХИТ</span></sc-if></span>
<span style="display: flex; flex-direction: column; gap: 4px; text-align: left">
<span style="font-size: 26px; font-weight: 700; letter-spacing: -0.03em; color: #0B2540">{{f.city}}</span>
<span style="font-size: 13px; color: #45607A">{{f.country}}</span>
</span>
<span style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: #0B2540"><span>{{f.hint}}</span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"></path></svg></span>
</span>
</button>
</sc-for>
</div>

<p style="margin: 0; text-align: center; font-size: 13px; color: #45607A">Клик по&nbsp;папке выводит её вперёд, повторный клик открывает досье города</p>

</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["Хиты-акцент","Цвета городов","Оттенки неба"],"default":"Хиты-акцент"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  state = { active: 4, open: false };
  renderVals() {
    const palette = this.props.palette ?? 'Хиты-акцент';
    const data = [
      { city: 'Тбилиси', country: 'Грузия', code: 'TBS', tone: ['#D9A0AE', '#8E2C48'] },
      { city: 'Казань', country: 'Россия', code: 'KZN', tone: ['#7FC0B0', '#3E8C7B'] },
      { city: 'Ереван', country: 'Армения', code: 'EVN', tone: ['#E9B0AC', '#C27474'] },
      { city: 'Пекин', country: 'Китай', code: 'PEK', tone: ['#E3A39A', '#B23A2E'] },
      { city: 'Стамбул', country: 'Турция', code: 'IST', tone: ['#77B7C6', '#2F7C8E'], hit: true },
      { city: 'Сочи', country: 'Россия', code: 'AER', tone: ['#80CBE4', '#2C93BC'], hit: true },
      { city: 'Ханой', country: 'Вьетнам', code: 'HAN', tone: ['#E9C77E', '#B8862B'] },
      { city: 'Занзибар', country: 'Танзания', code: 'ZNZ', tone: ['#8FD3CF', '#2A9D96'], hit: true },
      { city: 'Шанхай', country: 'Китай', code: 'PVG', tone: ['#B9A6E6', '#6A4FC2'] },
      { city: 'Алтай', country: 'Россия', code: 'RGK', tone: ['#A3BF9E', '#5C8457'] },
      { city: 'Калининград', country: 'Россия', code: 'KGD', tone: ['#EEC57E', '#C08A2E'] }
    ];
    const mix = (c1, c2, t) => '#' + [0, 2, 4].map((k) => Math.round(parseInt(c1.substr(1 + k, 2), 16) * (1 - t) + parseInt(c2.substr(1 + k, 2), 16) * t).toString(16).padStart(2, '0')).join('');
    const sky = data.map((_, k) => { const t = k / (data.length - 1); return [mix('#EAF7FD', '#5FB6DF', t), mix('#CDEBF7', '#127FB0', t)]; });
    const brand = 'linear-gradient(150deg, #38BDE8 0%, #E8288E 55%, #8B6CF0 100%)';
    const { active, open } = this.state;
    const temps = [30, 42, 58, 74, 90, 100, 96, 80, 62, 46, 34, 28];
    const folders = data.map((d, i) => {
      const dd = i - active;
      const ad = Math.abs(dd);
      const isA = dd === 0;
      let fill, tabBg, tabInk, accent, badge = false;
      if (palette === 'Цвета городов') {
        fill = 'linear-gradient(160deg,' + d.tone[0] + ',' + d.tone[1] + ')';
        tabBg = d.tone[0]; tabInk = '#0B2540'; accent = d.tone[1];
      } else if (palette === 'Оттенки неба') {
        const c = sky[i];
        fill = isA ? brand : 'linear-gradient(160deg,' + c[0] + ',' + c[1] + ')';
        tabBg = isA ? '#C8146F' : c[0]; tabInk = isA ? '#FFFFFF' : '#0B2540'; accent = isA ? '#C8146F' : c[1];
      } else {
        badge = !!d.hit;
        fill = d.hit ? brand : 'linear-gradient(160deg, #EEF8FD, #CFE8F4)';
        tabBg = d.hit ? '#C8146F' : '#DDF0F8'; tabInk = d.hit ? '#FFFFFF' : '#0B2540'; accent = d.hit ? '#C8146F' : '#5DB3D6';
      }
      const spread = open && !isA ? 1.35 : 1;
      const x = dd * 230 * spread;
      const y = dd * dd * 20 + (isA && open ? 30 : 0);
      const r = dd * 6;
      const s = isA ? (open ? 1.12 : 1) : Math.max(0.62, 1 - ad * 0.1);
      const o = ad > 3 ? 0 : (open && !isA ? 0.35 : 1 - ad * 0.2);
      const sheetUp = isA && open;
      return {
        city: d.city, country: d.country, code: d.code,
        badge,
        hint: isA ? (open ? 'Закрыть досье' : 'Открыть досье') : 'Выбрать',
        expanded: sheetUp ? 'true' : 'false',
        label: d.city + ', ' + d.country + (d.hit ? ', хит' : '') + (isA ? (open ? ', досье открыто' : ', выбрано') : ''),
        pick: () => this.setState(isA ? { open: !open } : { active: i, open: false }),
        temps: temps.map((t, k) => ({ s: 'flex: 1 1 0; height: ' + t + '%; border-radius: 3px; background: ' + (k === 4 || k === 5 ? accent : '#CBEAF6') })),
        wrap: 'position: absolute; left: 50%; top: 110px; width: 290px; height: 330px; margin-left: -145px; padding: 0; border: 0; background: transparent; cursor: pointer; font-family: inherit; color: inherit; ' +
          'z-index: ' + (20 - ad) + '; opacity: ' + o + '; pointer-events: ' + (o === 0 ? 'none' : 'auto') + '; transform: translate(' + x + 'px,' + y + 'px) rotate(' + r + 'deg) scale(' + s + ')',
        tab: 'position: absolute; top: -26px; left: 0; height: 40px; padding: 0 16px; border-radius: 14px 14px 0 0; background: ' + tabBg + '; color: ' + tabInk + '; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; line-height: 30px',
        back: 'position: absolute; inset: 0; border-radius: 0 22px 22px 22px; background: ' + fill + '; box-shadow: 0 30px 60px rgba(11,37,64,' + (isA ? '.2' : '.1') + ')',
        sheet: 'position: absolute; left: 14px; right: 14px; top: 16px; height: 260px; box-sizing: border-box; padding: 16px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(11,37,64,.12); display: flex; flex-direction: column; gap: 14px; transform: translateY(' + (sheetUp ? -170 : 0) + 'px)',
        front: 'position: absolute; left: 0; right: 0; bottom: 0; height: 230px; box-sizing: border-box; padding: 22px; border-radius: 22px; display: flex; flex-direction: column; justify-content: space-between; transform-origin: bottom; background: rgba(255,255,255,.5); transform: ' + (sheetUp ? 'rotateX(-24deg) translateY(10px)' : 'none'),
        icon: 'width: 52px; height: 52px; border-radius: 16px; background: radial-gradient(circle at 32% 26%, #FFFFFF 0%, rgba(255,255,255,0) 45%), ' + fill + '; box-shadow: 0 12px 22px rgba(11,37,64,.16)'
      };
    });
    const n = data.length;
    return {
      folders,
      prev: () => this.setState({ active: (active - 1 + n) % n, open: false }),
      next: () => this.setState({ active: (active + 1) % n, open: false })
    };
  }
}
</script>
</body>
</html>
